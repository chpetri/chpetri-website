name: Test

# The site is hosted on a Hetzner web space and uploaded with scripts/deploy-ftp.sh.
# This workflow only checks every push: locked install, audit, build and tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit build dependency
        run: npm audit --audit-level=high

      - name: Test and build static site
        run: npm test
        env:
          PUBLISH_CHECK: "1"
